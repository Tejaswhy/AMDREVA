<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitality AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#14422d",
              "primary-fixed": "#bceecf",
              "primary-fixed-dim": "#a1d1b4",
              "on-primary": "#ffffff",
              "on-primary-fixed": "#002112",
              "surface-container-highest": "#dce2f3",
              "on-surface-variant": "#414943",
              background: "#f9f9ff",
              "secondary-fixed-dim": "#a1d1bf",
              "on-error-container": "#93000a",
              "on-surface": "#151c27",
              "surface-container-lowest": "#ffffff",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#ebf1ff",
              "surface-tint": "#3a674f",
              "on-secondary": "#ffffff",
              "error-container": "#ffdad6",
              "secondary-container": "#bcedda",
              "on-tertiary-fixed": "#171d1b",
              "surface-dim": "#d3daea",
              "surface-container-low": "#f0f3ff",
              "error": "#ba1a1a",
              "on-tertiary-container": "#c1c6c4",
              "surface-container-high": "#e2e8f8",
              "on-secondary-fixed-variant": "#214f41",
              "tertiary": "#363c3a",
              "tertiary-container": "#4d5351",
              "on-tertiary-fixed-variant": "#424846",
              "surface": "#f9f9ff",
              "on-error": "#ffffff",
              "primary-container": "#2d5a43",
              "on-background": "#151c27",
              "on-secondary-container": "#406d5e",
              "on-primary-container": "#9fcfb2",
              "tertiary-fixed-dim": "#c2c8c5",
              "surface-variant": "#dce2f3",
              "outline": "#717973",
              "on-primary-fixed-variant": "#224f39",
              "inverse-surface": "#2a313d",
              "tertiary-fixed": "#dee4e1",
              "surface-container": "#e7eefe",
              "secondary-fixed": "#bcedda",
              "secondary": "#3a6758",
              "on-secondary-fixed": "#002118",
              "inverse-primary": "#a1d1b4",
              "surface-bright": "#f9f9ff",
              "outline-variant": "#c0c9c1"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
            spacing: {
              base: "8px",
              "section-margin": "32px",
              "element-gap": "16px",
              "container-padding": "24px"
            },
            fontFamily: {
              h1: ["Space Grotesk", "sans-serif"],
              h2: ["Space Grotesk", "sans-serif"],
              "label-caps": ["Manrope", "sans-serif"],
              "body-md": ["Manrope", "sans-serif"],
              "body-lg": ["Manrope", "sans-serif"]
            },
            fontSize: {
              h1: ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "600" }],
              h2: ["24px", { lineHeight: "1.3", fontWeight: "600" }],
              "label-caps": ["12px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "700" }],
              "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
              "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }]
            }
          }
        }
      };
    </script>
    <style>
      .glass-panel {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .progress-ring {
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      .organic-gradient {
        background: linear-gradient(135deg, #bceecf 0%, #a1d1bf 100%);
      }
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
